<div class="control-center">
  <div class="control-center-heading">
    <h1 class="page-title" data-i18n="overview.title">Control center</h1>
    <p data-i18n="overview.subtitle">Choose what you want to configure. Existing pages and direct links remain available.</p>
  </div>

  <section class="control-center-section" aria-labelledby="overview-start-title">
    <h2 id="overview-start-title" data-i18n="overview.start.title">Get started</h2>
    <div class="control-center-grid">
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["setup"]'><strong data-i18n="overview.setup.title">First-run setup</strong><span data-i18n="overview.setup.description">Connect the chat model and finish the required owner settings.</span></button>
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["character"]'><strong data-i18n="overview.character.title">Conversation and character</strong><span data-i18n="overview.character.description">Edit the character, world material, relationship facts, and model routing.</span></button>
    </div>
  </section>

  <section class="control-center-section" aria-labelledby="overview-behavior-title">
    <h2 id="overview-behavior-title" data-i18n="overview.behavior.title">Behavior and connections</h2>
    <div class="control-center-grid">
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["scheduler"]'><strong data-i18n="overview.proactive.title">Proactive behavior</strong><span data-i18n="overview.proactive.description">Enable scheduled activity, review wake-up state, and manage delivery integrations.</span></button>
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["tools"]'><strong data-i18n="overview.tools.title">Tools and external connections</strong><span data-i18n="overview.tools.description">Set tool exposure and connect MCP servers.</span></button>
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["status"]'><strong data-i18n="overview.channels.title">Channels and devices</strong><span data-i18n="overview.channels.description">Check channel availability, device integrations, and runtime status.</span></button>
    </div>
  </section>

  <section class="control-center-section" aria-labelledby="overview-maintain-title">
    <h2 id="overview-maintain-title" data-i18n="overview.maintain.title">Maintain and inspect</h2>
    <div class="control-center-grid">
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["observe-memory"]'><strong data-i18n="overview.memory.title">Memory and growth</strong><span data-i18n="overview.memory.description">Inspect memory, mood, growth, and source records without changing them.</span></button>
      <button class="control-center-card control-center-card-readonly" type="button" data-action="goto" data-action-args='["observe-runtime"]'><strong data-i18n="overview.observability.title">Observability and troubleshooting</strong><span data-i18n="overview.observability.description">Read operational signals, logs, prompt views, and diagnostics.</span><em data-i18n="overview.readonly">Read-only</em></button>
      <button class="control-center-card" type="button" data-action="goto" data-action-args='["auth-tokens"]'><strong data-i18n="overview.security.title">Security and accounts</strong><span data-i18n="overview.security.description">Manage access tokens and review channel access controls.</span></button>
    </div>
  </section>
</div>

<div class="page-inner">
  <h1 class="page-title">唤醒状态 <span class="admin-inline-105">内置自主活动</span></h1>
  <div class="admin-inline-047"><button class="btn btn-ghost btn-sm" data-action="loadObserveAutonomy">刷新</button><select id="autonomy-test-source"><option value="manual">manual</option><option value="overflow">overflow</option><option value="schedule">schedule</option><option value="interval">interval</option></select><button class="btn btn-primary btn-sm" data-action="enqueueAutonomyTest">排队一次测试</button></div>
  <div class="card"><div class="card-header"><h3>总览与 Talk 状态</h3></div><pre id="autonomy-status" class="obs-pre">加载中…</pre></div>
  <div class="card"><div class="card-header"><h3>总控与预算</h3></div><div class="form-row"><label><input id="autonomy-enabled" type="checkbox"> 启用内置唤醒</label><label><input id="autonomy-talk" type="checkbox"> 启用 Talk</label><label>每日评估 <input id="autonomy-daily" type="number" min="1" max="100"></label><label>最小评估间隔（秒）<input id="autonomy-min-interval" type="number" min="0"></label><button class="btn btn-primary btn-sm" data-action="saveAutonomyConfig">保存</button></div></div>
  <div class="card"><div class="card-header"><h3>Overflow</h3></div><div class="form-row"><label><input id="autonomy-overflow-enabled" type="checkbox"> 启用</label><label>阈值 <input id="autonomy-overflow-threshold" type="number" min="0.01" step="0.01"></label></div></div>
  <div class="card"><div class="card-header"><h3>定时唤醒</h3></div><div class="form-row"><label><input id="autonomy-schedule-enabled" type="checkbox"> 启用</label><label>时间 <input id="autonomy-schedule-time" type="time"></label><label>时区 <input id="autonomy-schedule-timezone" placeholder="local 或 Asia/Shanghai"></label><label>星期（0-6，逗号）<input id="autonomy-schedule-weekdays"></label><label>窗口起 <input id="autonomy-window-start" type="time"></label><label>窗口止 <input id="autonomy-window-end" type="time"></label><label>重启策略 <select id="autonomy-miss-policy"><option value="skip">skip</option><option value="catch_up_once">catch_up_once</option></select></label></div></div>
  <div class="card"><div class="card-header"><h3>间隔唤醒</h3></div><div class="form-row"><label><input id="autonomy-interval-enabled" type="checkbox"> 启用</label><label>距上次完成评估（秒）<input id="autonomy-interval" type="number" min="60"></label></div></div>
  <div class="card"><div class="card-header"><h3>自主工具</h3></div><div id="autonomy-tools" class="table-wrap">加载中…</div></div>
  <div class="card"><div class="card-header"><h3>最近运行</h3></div><pre id="autonomy-runs" class="obs-pre">加载中…</pre></div>
</div>


      <h1 class="page-title">用户管理</h1>

      <!-- 群聊蒸馏 -->
      <div class="card admin-inline-056">
        <div class="card-header">
          <h3>群聊蒸馏</h3>
        </div>
        <div class="admin-toolbar admin-inline-040">
          <input type="text" id="distill-group-id" placeholder="输入群号…" class="admin-inline-203">
          <button class="btn btn-primary btn-sm" data-action="runGroupDistill">立即蒸馏</button>
          <span class="admin-inline-082">分析群聊记录，生成话题/成员性格/有趣发言摘要</span>
        </div>
        <textarea id="distill-result" readonly placeholder="蒸馏结果将显示在这里…" class="admin-inline-162"></textarea>
      </div>

      <div class="search-row admin-toolbar">
        <input type="text" id="user-search" placeholder="搜索用户 ID…" oninput="filterUsers()">
        <button class="btn btn-ghost btn-sm" data-action="loadUsers">刷新</button>
      </div>
      <div class="card" id="user-table-card">
        <div id="user-table-body"><div class="loading">加载中…</div></div>
      </div>

      <!-- 黑名单（并入用户管理） -->
      <div class="card">
        <div class="card-header"><h3>添加黑名单</h3></div>
        <div class="admin-inline-037">
          <input type="text" id="bl-add-input" placeholder="输入 QQ 号" class="admin-inline-150">
          <button class="btn btn-danger" data-action="addBlacklist">屏蔽</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>当前黑名单</h3>
          <button class="btn btn-ghost btn-sm" data-action="loadBlacklist">刷新</button>
        </div>
        <div id="bl-list"><div class="loading">加载中…</div></div>
      </div>

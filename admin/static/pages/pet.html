
      <h1 class="page-title">宠物</h1>

      <!-- 宠物状态卡 -->
      <div class="card" id="pet-status-card">
        <div class="card-header">
          <h3>宠物状态</h3>
          <button class="btn btn-ghost btn-sm" data-action="loadPet">刷新</button>
        </div>
        <div id="pet-display"><div class="loading">加载中…</div></div>
      </div>

      <!-- 设置宠物 -->
      <div class="card">
        <div class="card-header"><h3>设置宠物</h3></div>
        <div class="admin-inline-031">
          <label class="field admin-inline-067">
            <span>名字</span>
            <input type="text" id="pet-name-input" placeholder="给它起个名字…">
          </label>
          <label class="field admin-inline-065">
            <span>种类</span>
            <select id="pet-species-input">
              <option value="猫">🐱 猫</option>
              <option value="狗">🐶 狗</option>
              <option value="兔子">🐰 兔子</option>
              <option value="鸟">🐦 鸟</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <button class="btn btn-primary btn-sm admin-inline-129" data-action="savePet">保存</button>
        </div>
      </div>


      <h1 class="page-title">错误日志</h1>
      <div class="card">
        <div class="card-header">
          <h3>最近日志</h3>
          <div class="admin-inline-038">
            <select id="log-lines" onchange="loadLogs()" class="admin-inline-197">
              <option value="100">100 行</option>
              <option value="200" selected>200 行</option>
              <option value="500">500 行</option>
            </select>
            <button class="btn btn-ghost btn-sm" data-action="loadLogs">刷新</button>
            <button class="btn btn-danger btn-sm" data-action="clearLogs">清空日志</button>
          </div>
        </div>
        <div class="log-box" id="log-box">加载中…</div>
        <div id="log-meta" class="admin-inline-090"></div>
      </div>

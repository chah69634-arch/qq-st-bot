
      <h1 class="page-title">关系事实</h1>

      <div class="card">

            <select id="rf-uid-select" onchange="loadRelationshipFacts()"></select>
          </label>
          <label class="field admin-inline-066">

          <button class="btn btn-primary btn-sm admin-inline-138" data-action="openFactModal">+ 手动添加</button>
        </div>
      </div>
